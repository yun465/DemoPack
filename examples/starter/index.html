<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>启航 · 发布看板</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#17282c;font:15px/1.5 system-ui,sans-serif}header{height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce0d9;padding:0 32px;background:#fff}header b{font-size:22px;letter-spacing:-1px}header span{color:#667570;font-size:12px}main{padding:22px 32px}small{font-size:11px;letter-spacing:2px;color:#487763}h1{font-size:28px;margin:5px 0}p{color:#63736b;margin:6px 0 10px}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#e2f3e9;padding:8px 14px;color:#257355;border-radius:24px;font-size:13px}form{display:flex;gap:10px;margin:16px 0}input{flex:1;border:1px solid #c6d1c9;border-radius:8px;padding:12px;font:inherit}button{background:#174e40;color:#fff;border:0;padding:12px 20px;border-radius:8px;font:600 14px system-ui;cursor:pointer}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.column{background:#e9ece5;border-radius:12px;padding:12px;min-height:190px}.column h2{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;margin:0 0 14px;color:#66776a}.card{background:#fff;border:1px solid #dde3dc;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 8px #172b2410}.card button{padding:7px 12px;background:#eef7f1;color:#245d48}.done .card{border-left:3px solid #38936c}.status{font-size:12px;color:#357055;margin-top:15px}
</style><header><b>◒ 启航</b><span>本地示例 · 虚构项目</span></header><main><div class="top"><div><small>项目发布工作区</small><h1>离发布，再近一步。</h1><p>整理任务，确认进展，为项目准备一次清楚的发布。</p></div><span class="badge" id="progress">已完成 1 / 3</span></div><form id="add"><input id="task" aria-label="任务名称" placeholder="这次发布还要做什么？"><button>添加任务</button></form><div class="columns"><section class="column"><h2>待完成 <span id="count">2</span></h2><div id="todo"><div class="card"><span>编写更新说明</span><button>完成</button></div><div class="card"><span>检查页面可访问性</span><button>完成</button></div></div></section><section class="column done"><h2>已就绪</h2><div id="done"><div class="card"><span>标记候选版本</span><span>✓</span></div></div></section></div><div class="status" role="status">示例数据仅保留在本次浏览器会话中。</div></main><script>
const todo=document.querySelector('#todo'),done=document.querySelector('#done');function update(){document.querySelector('#count').textContent=todo.children.length;document.querySelector('#progress').textContent=`已完成 ${done.children.length} / ${todo.children.length+done.children.length}`;}document.querySelector('#add').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#task');if(!input.value.trim())return;const card=document.createElement('div');card.className='card';const label=document.createElement('span');label.textContent=input.value;const button=document.createElement('button');button.textContent='完成';card.append(label,button);todo.append(card);input.value='';document.querySelector('[role=status]').textContent='任务已添加到发布看板。';update();};todo.onclick=e=>{if(e.target.tagName!=='BUTTON')return;const card=e.target.parentElement;e.target.replaceWith(document.createTextNode('✓'));done.append(card);document.querySelector('[role=status]').textContent='又完成了一项发布准备。';update();};
</script></html>
