<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>小笺 · 本地示例</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7f1;color:#343128;font:16px/1.6 "Microsoft YaHei",system-ui}header{padding:18px 36px;border-bottom:1px solid #ddd6c9;display:flex;justify-content:space-between}header span{font-size:12px;color:#847b68}main{padding:30px 36px}h1{font-size:30px;margin:0}p{color:#827965}form{display:flex;gap:12px;margin:25px 0}input{flex:1;border:1px solid #d3cbb9;border-radius:8px;background:white;padding:12px;font:inherit}button{border:0;border-radius:8px;background:#7955a4;color:white;padding:12px 22px;font:inherit;cursor:pointer}#notes{display:flex;gap:20px}.note{background:#f3e7b6;padding:22px;width:260px;border-radius:3px;min-height:190px;box-shadow:3px 5px 0 #e8decb}.note small{color:#847848}.note p{color:#433927}.note button{font-size:12px;padding:6px 12px;background:#ffffff90;color:#625036}.pinned{outline:3px solid #9c78c0}#status{margin-top:22px;color:#7955a4}</style><header><b>✳ 小笺</b><span>本地示例 / 虚构内容</span></header><main><h1>留下一件值得记住的小事。</h1><p>写下想法，收好灵感，继续手头的创作。</p><form><input id="content" aria-label="便签内容" placeholder="今天想记住什么？"><button>保存便签</button></form><section id="notes"><article class="note"><small>灵感 01</small><p>给开源项目准备一份清楚的使用演示。</p><button>置顶</button></article></section><div id="status" role="status">内容仅保留在当前页面，不上传。</div></main><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const input=document.querySelector('input');if(!input.value.trim())return;const note=document.createElement('article');note.className='note';const small=document.createElement('small');small.textContent='新的想法';const p=document.createElement('p');p.textContent=input.value;const button=document.createElement('button');button.textContent='置顶';note.append(small,p,button);document.querySelector('#notes').append(note);input.value='';document.querySelector('#status').textContent='便签已保存。';};document.querySelector('#notes').onclick=e=>{if(e.target.tagName!=='BUTTON')return;e.target.parentElement.classList.toggle('pinned');e.target.textContent=e.target.parentElement.classList.contains('pinned')?'取消置顶':'置顶';document.querySelector('#status').textContent='重要的想法已经置顶。';};</script></html>
